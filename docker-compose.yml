services:
  # FastAPI AI/ML & Navigation Backend Service (Connects to Supabase PostgreSQL + PostGIS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antarctic_api_backend
    restart: always
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      SUPABASE_URL: ${SUPABASE_URL:-https://hbvutrfkcyduzlatmueg.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_msDo_yVi5kGbJ7X_i3HfQg_4y-tyQUM}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-sb_publishable_msDo_yVi5kGbJ7X_i3HfQg_4y-tyQUM}
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models

  # React + Vite Decision Support Frontend
  frontend:
    image: node:20-alpine
    container_name: antarctic_web_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://hbvutrfkcyduzlatmueg.supabase.co}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_msDo_yVi5kGbJ7X_i3HfQg_4y-tyQUM}
